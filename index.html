<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Simple Music Player</title>
 <style>
 * { box-sizing: border-box; margin: 0; padding: 0; text-decoration: none; }
 body { background: #1c1d1b; color: white; font-family: Arial, sans-serif; }
 .sidebar { position: fixed; width: 220px; height: 100vh; padding: 25px 15px; background: #252a23; }
 .sidebar h1 { margin-bottom: 30px; color: #edefe8; }
 .sidebar a { display: block; padding: 12px; margin-bottom: 8px; color: #ccc; text-decoration: none; border-radius: 8px; }
 .sidebar a:hover { background: #353b32; color: white; }
 .main { margin-left: 220px; padding: 30px; padding-bottom: 130px; }
 .search { margin-bottom: 35px; }
 .search input { width: 350px; max-width: 70%; padding: 12px; border: none; border-radius: 8px 0 0 8px; background: #292d28; color: white; }
 .search button { padding: 12px 18px; border: none; border-radius: 0 8px 8px 0; background: #c9e878; cursor: pointer; }
 .welcome { margin-bottom: 25px; }
 .welcome p { color: #999; }
 .welcome h2 { margin-top: 8px; font-size: 32px; }
 .welcome span { color: #c9e878; }
 .playlist { display: flex; flex-wrap: wrap; gap: 20px; }
 .playlist-card { width: 170px; padding: 12px; background: #252a23; border-radius: 10px; cursor: pointer; }
 .playlist-card:hover { background: #353b32; transform: translateY(-4px); }
 .playlist-card img { width: 100%; height: 145px; object-fit: cover; border-radius: 7px; }
 .playlist-card h3 { margin-top: 10px; }
 .playlist-card p { margin-top: 5px; color: #999; font-size: 13px; }
 .library { margin-top: 40px; }
 .library p { margin: 8px 0 20px; color: #999; }
 .player { position: fixed; left: 0; bottom: 0; width: 100%; height: 100px; display: flex; align-items: center; gap: 15px; padding: 15px; background: #111310; border-top: 1px solid #444; }
 .album { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
 .song-info { width: 180px; }
 .song-info p:last-child { margin-top: 5px; color: #999; font-size: 13px; }
 .controls { margin: auto; }
 .controls button { width: 45px; height: 45px; margin: 3px; border: none; border-radius: 50%; background: transparent; color: white; font-size: 20px; cursor: pointer; }
 #playButton { background: #c9e878; color: black; }
 .volume { margin-right: 20px; }
 #progress { position: absolute; left: 0; top: -5px; width: 100%; }
 </style>
</head>
<body>

 <h1>♫ Music Player</h1>

 </div>

 <div class="search">
 <input type="text" id="searchInput" placeholder="Search music...">
 <button onclick="searchSongs()">Search</button>
 </div>

 let artistName = document.getElementById("artistName");

 { name: "Workout Music", artist: "Workout Artist", file: "song3.mp3" }
 ];
 let currentSong = 0;
 function playSong(number) {
 currentSong = number;
 audio.src = songs[currentSong].file;
 songName.innerHTML = songs[currentSong].name;
 artistName.innerHTML = songs[currentSong].artist;
 audio.play();
 playButton.innerHTML = "⏸";
 }
 function playPause() {
 if (audio.paused) {
 audio.play();
 playButton.innerHTML = "⏸";
 } else {
 audio.pause();
 playButton.innerHTML = "▶";
 }
 }
 function nextSong() {
 currentSong++;
 if (currentSong >= songs.length) { currentSong = 0; }
 playSong(currentSong);
 }
 function previousSong() {
 currentSong--;
 if (currentSong < 0) { currentSong = songs.length - 1; }
 playSong(currentSong);
 }
 audio.addEventListener("timeupdate", function() {
 if (audio.duration) {
 progress.value = (audio.currentTime / audio.duration) * 100;
 }
 });
 progress.addEventListener("input", function() {
 audio.currentTime = (progress.value / 100) * audio.duration;
 });
 volume.addEventListener("input", function() {
 audio.volume = volume.value;
 });

 let title = cards[i].querySelector("h3").innerHTML.toLowerCase();

 cards[i].style.display = "block";
 } else {
 cards[i].style.display = "none";
 }
 }
 }
